# Test-only Wrangler config.
#
# Why this file exists: the deploy config at the repository root
# (`../wrangler.toml`) declares `[assets] directory = "web/dist"`. That
# directory does not exist during worker-only development, and the
# @cloudflare/vitest-pool-workers Miniflare instance fails to start when the
# assets directory is missing or unresolvable. This config is the same Worker
# minus `[assets]`, with paths relative to this directory, plus a small
# `AUTH_ITERATIONS` override so the PBKDF2 login path stays fast in tests
# (see src/auth.ts).
name = "vps-dog-test"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "vps-dog"
database_id = "local-test-database"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

[vars]
ENVIRONMENT = "test"
# Fast PBKDF2 for tests only. Production default (unset) is 100000.
AUTH_ITERATIONS = "1000"
